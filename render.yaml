services:
  - type: web
    name: aconcagua-colombia-leads
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ACONCAGUA_HOST
        value: 0.0.0.0
      - key: ACONCAGUA_PORT
        value: "8080"
      - key: ACONCAGUA_DB_PATH
        value: /app/data/aconcagua.db
      - key: MAX_DAILY_EMAILS
        value: "25"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: SMTP_PASS
        sync: false
